# Built-in credential taint sources, expressed as user-editable YAML.
#
# SCBoX already tracks these sources natively (see internal/trace/signatures.go:
# sensitiveEnv / sensitivePath / infostealerPaths). This file restates them in
# the --rules format so you can copy it, trim it to your environment, or extend
# it with org-specific secrets. Each rule fires only when a value SCBoX served
# for one of its sources actually reaches a sink (raw or base64/hex encoded) -
# a read alone never scores.
#
#   scbox --rules examples/taint/builtin-credentials.yml ./suspicious-package
#
# Glob syntax: in file patterns `*` stops at `/`, `**` crosses it, a leading `~`
# matches any home directory; env patterns are plain names with `*`/`?`.

taint:
  - name: cloud-credentials-env
    description: cloud/registry/CI credential env vars (AWS, GCP, Azure, npm, GitHub, Docker)
    severity: malicious
    sources:
      - { env: "NPM_TOKEN" }
      - { env: "AWS_*" }
      - { env: "GITHUB_TOKEN" }
      - { env: "GH_TOKEN" }
      - { env: "*SECRET*" }
      - { env: "*PASSWORD*" }
      - { env: "*PRIVATE_KEY*" }
      - { env: "*API_KEY*" }
      - { env: "*ACCESS_KEY*" }
      - { env: "*SSH*" }
      - { env: "DOCKER_*" }
      - { env: "GCP_*" }
      - { env: "AZURE_*" }
    sinks: [network, command, file]

  - name: secret-files
    description: SSH keys, cloud creds, dotenv, shell history, package-registry auth
    severity: malicious
    sources:
      - { file: "**/.ssh/**" }
      - { file: "**/id_rsa" }
      - { file: "**/id_ed25519" }
      - { file: "**/.npmrc" }
      - { file: "**/.aws/**" }
      - { file: "**/.docker/**" }
      - { file: "**/.env" }
      - { file: "**/.env.*" }
      - { file: "**/.bash_history" }
      - { file: "**/.netrc" }
      - { file: "**/.git-credentials" }
      - { file: "**/.pgpass" }
      - { file: "**/.my.cnf" }
      - { file: "**/.config/gcloud/**" }
      - { file: "**/.kube/config" }
      - { file: "**/.config/gh/hosts" }
      - { file: "/etc/passwd" }
      - { file: "/etc/shadow" }
    sinks: [network, command, file]

  - name: infostealer-stores
    description: browser login/cookie databases, crypto-wallet storage, OS keychains
    severity: malicious
    sources:
      - { file: "**/Login Data" }
      - { file: "**/cookies.sqlite" }
      - { file: "**/Cookies" }
      - { file: "**/logins.json" }
      - { file: "**/key4.db" }
      - { file: "**/Local State" }
      - { file: "**/wallet.dat" }
      - { file: "**/exodus/**" }
      - { file: "**/electrum/**" }
      - { file: "**/.ethereum/keystore/**" }
      - { file: "**/login.keychain" }
      - { file: "**/keychain-db" }
    sinks: [network, command, file]
